<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaksi Berhasil - HealthyCare</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <div class="success-page">
    <div class="success-hero"></div>

    <div class="success-brand">
      <div class="brand-icon">
        <img src="assets/app-icon/appLogo.png" alt="Logo HealthyCare">
      </div>
      <span>HealthyCare</span>
    </div>

    <div class="success-card">
      <div class="success-check">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>

      <h1 class="success-title">Transaksi Berhasil</h1>

      <div class="success-rows">
        <div class="success-row">
          <span>Tanggal</span>
          <span>14 Nov 2026, 14:20 WIB</span>
        </div>
        <div class="success-row">
          <span>No. Pesanan</span>
          <span>HC-20261114-001</span>
        </div>
        <div class="success-row">
          <span>Nama Pembeli</span>
          <span>Arnold Adra</span>
        </div>
        <div class="success-row">
          <span>Keterangan</span>
          <span>Pembelian Obat (2 Item)</span>
        </div>
        <div class="success-row">
          <span>Subtotal</span>
          <span>Rp 18.000</span>
        </div>
      </div>

      <div class="success-total">
        <span>Total Pembayaran</span>
        <span>Rp 19.000</span>
      </div>

      <div class="success-btns">
        <a href="invoice.html" class="btn btn-emerald" style="width: 100%; height: 42px;">
          Lihat Detail Invoice
        </a>
        <a href="customer.html" class="btn btn-outline" style="width: 100%; color: #334155; border-color: #cbd5e1;">
          Kembali ke Beranda
        </a>
      </div>
    </div>
  </div>

</body>
</html>
